name: Deploy eufy-siren

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - pi-spello
          - spelloapp
          - all
          

jobs:
  deploy-pi-spello:
    name: Deploy → pi-spello
    if: ${{ inputs.environment == 'pi-spello' || inputs.environment == 'all' }}
    runs-on: [self-hosted, pi-spello]
    environment: pi-spello
    steps:
      - name: Stop the service
        run: |
          sudo --chdir=/home/pi/scripts/eufy-siren /home/pi/scripts/pyutil/servicectrl.sh stop

      - name: Pull latest from GitHub
        run: |
          sudo --chdir=/home/pi/scripts/eufy-siren /home/pi/scripts/pyutil/gitrefresh.sh --yes

      - name: Deploy and start the service
        run: sudo --chdir=/home/pi/scripts/eufy-siren /home/pi/scripts/pyutil/servicectrl.sh deploy pi-spello

      - name: Verify service is running
        run: |
          sleep 6
          sudo --chdir=/home/pi/scripts/eufy-siren /home/pi/scripts/pyutil/servicectrl.sh is-active

  deploy-spelloapp:
    name: Deploy → spelloapp
    if: ${{ inputs.environment == 'spelloapp' || inputs.environment == 'all' }}
    runs-on: [self-hosted, spelloapp]
    environment: spelloapp
    steps:
      - name: Stop the service
        run: |
          sudo --chdir=/home/nick/scripts/eufy-siren /home/nick/scripts/pyutil/servicectrl.sh stop

      - name: Pull latest from GitHub
        run: |
          sudo --chdir=/home/nick/scripts/eufy-siren /home/nick/scripts/pyutil/gitrefresh.sh --yes

      - name: Deploy and start the service
        run: sudo --chdir=/home/nick/scripts/eufy-siren /home/nick/scripts/pyutil/servicectrl.sh deploy spelloapp

      - name: Stop the service
        run: |
          sudo --chdir=/home/nick/scripts/eufy-siren /home/nick/scripts/pyutil/servicectrl.sh stop        

      # - name: Verify service is running
      #   run: |
      #     sleep 6
      #     sudo --chdir=/home/nick/scripts/eufy-siren /home/nick/scripts/pyutil/servicectrl.sh is-active
